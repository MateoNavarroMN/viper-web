<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Efecto de brillo de neón ampliado -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Anillos tecnológicos de fondo -->
  <circle cx="200" cy="200" r="160" stroke="#18181B" stroke-width="3" stroke-dasharray="15 15" />
  <circle cx="200" cy="200" r="190" stroke="#18181B" stroke-width="1" />
  
  <!-- Todo lo que tiene brillo verde, agrupado junto -->
  <g filter="url(#glow)">
    <!-- Contorno de la pelota -->
    <circle cx="200" cy="200" r="100" stroke="#10B981" stroke-width="8" />
    <!-- Línea curva izquierda -->
    <path d="M 130 130 Q 200 200 130 270" stroke="#10B981" stroke-width="8" stroke-linecap="round" />
    <!-- Línea curva derecha -->
    <path d="M 270 130 Q 200 200 270 270" stroke="#10B981" stroke-width="8" stroke-linecap="round" />
    
    <!-- Los nodos con brillo -->
    <circle cx="200" cy="70" r="6" fill="#10B981" />
    <circle cx="80" cy="260" r="7" fill="#10B981" />
  </g>
  
  <!-- Nodo derecho (sin brillo) -->
  <circle cx="330" cy="200" r="5" fill="#10B981" />
  
  <!-- Líneas conectoras -->
  <path d="M 200 70 L 200 100" stroke="#10B981" stroke-width="2" opacity="0.5" />
  <path d="M 330 200 L 300 200" stroke="#10B981" stroke-width="2" opacity="0.5" />
  <path d="M 80 260 L 110.5 244.7" stroke="#10B981" stroke-width="2" opacity="0.5" />
</svg>
