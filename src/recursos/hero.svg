<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Efecto de brillo de neón -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Órbita tenue para unificar los nodos y aportar al estilo radar -->
  <circle cx="200" cy="200" r="140" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 16" opacity="0.25" />

  <!-- Grupo principal con brillo -->
  <g filter="url(#glow)">
    <!-- Contorno de la pelota de tenis -->
    <circle cx="200" cy="200" r="100" stroke="#10B981" stroke-width="8" />
    <!-- Línea curva izquierda -->
    <path d="M 130 130 Q 200 200 130 270" stroke="#10B981" stroke-width="8" stroke-linecap="round" />
    <!-- Línea curva derecha -->
    <path d="M 270 130 Q 200 200 270 270" stroke="#10B981" stroke-width="8" stroke-linecap="round" />
    
    <!-- Los 3 nodos posicionados exactamente a 120 grados -->
    <circle cx="200" cy="60" r="7" fill="#10B981" /> <!-- Nodo Superior -->
    <circle cx="321.2" cy="270" r="7" fill="#10B981" /> <!-- Nodo Inferior Derecho -->
    <circle cx="78.8" cy="270" r="7" fill="#10B981" /> <!-- Nodo Inferior Izquierdo -->
  </g>
  
  <!-- Líneas conectoras desde los nodos al centro de la pelota -->
  <path d="M 200 60 L 200 100" stroke="#10B981" stroke-width="2.5" opacity="0.6" />
  <path d="M 321.2 270 L 286.6 250" stroke="#10B981" stroke-width="2.5" opacity="0.6" />
  <path d="M 78.8 270 L 113.4 250" stroke="#10B981" stroke-width="2.5" opacity="0.6" />
</svg>
